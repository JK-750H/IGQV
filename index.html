<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>IG Quicklist</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0e;--panel:#15151b;--panel2:#1d1d25;--line:#2b2b35;--text:#f4f4f6;--muted:#a4a4b2;--accent:#d6ff5f;--danger:#ff7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#22202b 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:auto;padding:22px 15px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.brand{font-size:24px;font-weight:850;letter-spacing:-.8px}.brand span{color:var(--accent)}.sub{color:var(--muted);font-size:12px;margin-top:2px}
.count{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:8px 11px;color:var(--muted);font-size:12px;white-space:nowrap}
.panel{background:rgba(21,21,27,.95);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px}
h2{font-size:14px;margin:0 0 12px;color:#d8d8e0}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
input,textarea,select{width:100%;min-width:0;background:#0e0e12;border:1px solid #33333e;border-radius:11px;color:var(--text);padding:12px;font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:68px}
button,.linkbtn{border:0;border-radius:11px;padding:11px 13px;font:700 13px system-ui;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:6px}
.primary{background:var(--accent);color:#111}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.danger{background:#351c21;color:#ffb4b4;border:1px solid #5c2a32}
.tools{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:10px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 13px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer}.chip.active{background:var(--accent);border-color:var(--accent);color:#101010;font-weight:800}
.list{display:grid;gap:10px}.person{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.personTop{display:flex;gap:11px;align-items:center}.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#d6ff5f,#b7a1ff);color:#111;font-weight:900;font-size:17px;flex-shrink:0}
.personName{font-weight:800;overflow-wrap:anywhere}.handle{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.tag{font-size:10px;border:1px solid #393945;color:#c9c9d5;padding:3px 7px;border-radius:999px;margin-top:5px;display:inline-block}
.note{font-size:13px;color:#c6c6d0;margin:10px 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button,.actions a{flex:1;min-width:80px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:15px}
.footer{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
.hidden{display:none!important}
@media(max-width:480px){main{padding:17px 12px 30px}.brand{font-size:22px}form{grid-template-columns:1fr}.full{grid-column:auto}.count{font-size:11px}.person{padding:12px}.actions button,.actions a{min-width:calc(50% - 7px)}}
</style>
</head>
<body>
<main>
  <header class="top">
    <div><div class="brand">IG <span>QUICKLIST</span></div><div class="sub">Your personal shortcut board</div></div>
    <div class="count" id="count">0 profiles saved</div>
  </header>

  <section class="panel">
    <h2 id="formTitle">＋ SAVE A PROFILE</h2>
    <form id="profileForm">
      <input id="name" placeholder="Name / nickname" maxlength="80" required>
      <input id="handle" placeholder="Instagram ID (without @)" maxlength="100" required>
      <select id="category">
        <option value="Favorites">Favorites</option><option value="Creators">Creators</option><option value="Friends">Friends</option><option value="Memes">Memes</option><option value="Other">Other</option>
      </select>
      <input id="noteInput" placeholder="Quick note (optional)" maxlength="300">
      <button class="primary full" id="saveBtn" type="submit">Save profile</button>
      <button class="secondary full hidden" id="cancelEdit" type="button">Cancel edit</button>
    </form>
  </section>

  <section>
    <div class="tools">
      <input id="search" placeholder="Search name, @ID, notes…">
      <button class="secondary" id="exportBtn" type="button">Export</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </section>
  <div class="footer">App-style shortcut board · Saved on this device. Export a backup before clearing browser data.</div>
</main>
<script>
const KEY='ig_quicklist_profiles_v1';
let profiles=[]; let editingId=null; let activeCategory='All';
const $=id=>document.getElementById(id);
function load(){try{profiles=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(profiles))profiles=[]}catch(e){profiles=[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(profiles));render()}
function cleanHandle(v){return v.trim().replace(/^@+/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/[/?#].*$/,'').trim()}
function profileUrl(p){return 'https://www.instagram.com/'+encodeURIComponent(p.handle)+'/';}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
  $('count').textContent=`${profiles.length} profile${profiles.length===1?'':'s'} saved`;
  const cats=['All',...new Set(profiles.map(p=>p.category||'Other'))];
  $('filters').innerHTML=cats.map(c=>`<button class="chip ${c===activeCategory?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}${c==='All'?'':` · ${profiles.filter(p=>(p.category||'Other')===c).length}`}</button>`).join('');
  const q=$('search').value.toLowerCase().trim();
  const shown=profiles.filter(p=>(activeCategory==='All'||(p.category||'Other')===activeCategory)&&[p.name,p.handle,p.note,p.category].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>(b.updated||b.created||0)-(a.updated||a.created||0));
  if(!shown.length){$('list').innerHTML=`<div class="empty">${profiles.length?'No matching profiles. Try another search or category.':'No profiles saved yet. Add an Instagram ID above to build your quicklist.'}</div>`;return}
  $('list').innerHTML=shown.map(p=>`<article class="person">
    <div class="personTop"><div class="avatar">${escapeHtml((p.name||p.handle||'?').trim().charAt(0).toUpperCase())}</div><div style="min-width:0;flex:1"><div class="personName">${escapeHtml(p.name||p.handle)}</div><div class="handle">@${escapeHtml(p.handle)}</div><span class="tag">${escapeHtml(p.category||'Other')}</span></div></div>
    ${p.note?`<div class="note">${escapeHtml(p.note)}</div>`:''}
    <div class="actions">
      <a class="linkbtn primary" href="${profileUrl(p)}" target="_blank" rel="noopener">Open profile ↗</a>
      <a class="linkbtn secondary" href="${profileUrl(p)}?__a=1" target="_blank" rel="noopener">View content ↗</a>
      <button class="secondary" data-copy="${escapeHtml(p.handle)}">Copy ID</button>
      <button class="secondary" data-edit="${p.id}">Edit</button>
      <button class="danger" data-delete="${p.id}">Delete</button>
    </div></article>`).join('');
}
function resetForm(){editingId=null;$('profileForm').reset();$('formTitle').textContent='＋ SAVE A PROFILE';$('saveBtn').textContent='Save profile';$('cancelEdit').classList.add('hidden')}
$('profileForm').addEventListener('submit',e=>{
 e.preventDefault();const name=$('name').value.trim();const handle=cleanHandle($('handle').value);if(!handle){alert('Enter an Instagram ID or profile URL.');return}
 if(!/^[A-Za-z0-9._]{1,30}$/.test(handle)){alert('That ID does not look valid. Enter the username only, without spaces.');return}
 const duplicate=profiles.find(p=>p.handle.toLowerCase()===handle.toLowerCase()&&p.id!==editingId);
 if(duplicate&&!confirm('This Instagram ID is already saved. Save another entry anyway?'))return;
 const now=Date.now();
 if(editingId){profiles=profiles.map(p=>p.id===editingId?{...p,name,handle,category:$('category').value,note:$('noteInput').value.trim(),updated:now}:p)}
 else profiles.push({id:String(now)+Math.random().toString(36).slice(2,7),name,handle,category:$('category').value,note:$('noteInput').value.trim(),created:now});
 resetForm();persist();
});
$('cancelEdit').addEventListener('click',resetForm);
$('search').addEventListener('input',render);
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){activeCategory=b.dataset.cat;render()}});
$('list').addEventListener('click',async e=>{
 const del=e.target.closest('[data-delete]');const edit=e.target.closest('[data-edit]');const copy=e.target.closest('[data-copy]');
 if(del){const p=profiles.find(x=>x.id===del.dataset.delete);if(p&&confirm(`Delete ${p.name||'@'+p.handle} from your list?`)){profiles=profiles.filter(x=>x.id!==p.id);if(editingId===p.id)resetForm();persist()}}
 if(edit){const p=profiles.find(x=>x.id===edit.dataset.edit);if(!p)return;editingId=p.id;$('name').value=p.name||'';$('handle').value=p.handle;$('category').value=p.category||'Other';$('noteInput').value=p.note||'';$('formTitle').textContent='✎ EDIT PROFILE';$('saveBtn').textContent='Update profile';$('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
 if(copy){const id=copy.dataset.copy;try{await navigator.clipboard.writeText('@'+id);copy.textContent='Copied ✓';setTimeout(()=>copy.textContent='Copy ID',1200)}catch(err){prompt('Copy this Instagram ID:', '@'+id)}}
});
$('exportBtn').addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify(profiles,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ig-quicklist-backup.json';a.click();URL.revokeObjectURL(url);
});
load();render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
